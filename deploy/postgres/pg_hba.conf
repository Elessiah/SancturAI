# TYPE  DATABASE   USER       ADDRESS            METHOD
# Aucune méthode sans authentification. Le socket est monté sur l'hôte (/srv/sancturai-data/pg-socket) :
# le relais s'y connecte par mot de passe (peer est inutilisable : les UID de l'hôte n'existent pas dans le conteneur).
local   all        postgres                      peer
local   sancturai  relay                         scram-sha-256
host    sancturai  sancturai  172.31.250.0/24    scram-sha-256
host    all        postgres   127.0.0.1/32       scram-sha-256
