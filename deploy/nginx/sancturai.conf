# Vhost SancturAI : remplace le vhost provisoire /etc/nginx/sites-available/sancturai.bluegenji-esport.fr
# (déjà activé, certificat Let's Encrypt déjà émis). N'affecte aucun autre site : noms préfixés `sancturai`.
# HTTP/2 est activé globalement (conf.d) ; snippets/security-headers.conf est inclus partout où un
# add_header local masquerait les en-têtes hérités (règle d'héritage nginx).

upstream sancturai_app {
    server unix:/run/sancturai/app.sock;
}

limit_req_zone $binary_remote_addr zone=sancturai:10m rate=20r/s;
# Connexions simultanées par IP : un flux MCP (SSE) tient jusqu'à proxy_read_timeout (300 s) et occupe deux
# connexions nginx ; sans plafond, une seule IP épuiserait worker_connections, partagé avec les autres sites.
limit_conn_zone $binary_remote_addr zone=sancturai_conn:10m;
# Plafond global du vhost : la clé par IP ne borne pas un client IPv6, qui change d'adresse dans son /64.
# Voulu : une saturation rend 429 aux agents de SancturAI mais n'atteint jamais les autres sites (setup.md §4).
limit_conn_zone $server_name zone=sancturai_total:1m;
# Envois au vault (jusqu'à 16 Mio, mis en tampon sur disque par nginx) : zones propres au vault, où seules les
# requêtes à corps comptent. Clé vide pour les lectures (GET, HEAD, OPTIONS) : nginx ne les compte pas. Les flux
# MCP et autres requêtes d'une IP n'entrent pas dans ces zones (revue batch 6, R2-I1).
map $request_method $sancturai_vault_upload_ip {
    GET "";
    HEAD "";
    OPTIONS "";
    default $binary_remote_addr;
}
map $request_method $sancturai_vault_upload_all {
    GET "";
    HEAD "";
    OPTIONS "";
    default $server_name;
}
limit_conn_zone $sancturai_vault_upload_ip zone=sancturai_vault_conn:10m;
limit_conn_zone $sancturai_vault_upload_all zone=sancturai_vault_total:1m;

# Spec §6.1 : les chemins du vault sont dans l'URL (`/api/vault/{path}`, `?prefix=`). On ne journalise
# jamais l'URI ni la query string. error_log en `alert` (pas `crit`) : nginx recopie la ligne de requête
# dans ses messages, et « connect() to unix:...app.sock failed (2: No such file) » (socket absent pendant
# un redémarrage de l'app) est émis au niveau crit, URI comprise.
# Définie une seule fois ici (niveau http) : le vhost provisoire qui la définissait est remplacé par ce fichier.
log_format sancturai_nouri '$remote_addr [$time_local] $request_method $status $body_bytes_sent $request_time';

# HTTP -> HTTPS (même rôle que le bloc ajouté par certbot ; les renouvellements passent par ce port).
server {
    listen 80;
    listen [::]:80;
    server_name sancturai.bluegenji-esport.fr;
    access_log /var/log/nginx/sancturai.access.log sancturai_nouri;
    error_log /var/log/nginx/sancturai.error.log alert;

    # URI brute (encodée) et jamais la variable décodée : celle-ci permet une injection CRLF dans Location
    return 301 https://sancturai.bluegenji-esport.fr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sancturai.bluegenji-esport.fr;

    ssl_certificate /etc/letsencrypt/live/sancturai.bluegenji-esport.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sancturai.bluegenji-esport.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/security-headers.conf;

    # Plafonds de corps = ceux de l'app (BodyLimitMiddleware.body_cap) : 64 Kio par défaut ici, puis 16 Mio pour le
    # vault, 128 Kio pour le forum, 256 Kio pour /mcp dans leurs locations. Corps refusés par nginx = corps renvoyé
    # par l'app, octet pour octet (tests/test_deploy_files.py). Un corps non authentifié ne dépasse donc jamais
    # 64 Kio hors du vault (revue batch 6, I1).
    client_max_body_size 64k;
    # Chemin temporaire des corps : celui de nginx par défaut (créé par son paquet). Aucun chemin de SancturAI ici :
    # nginx refuse de démarrer s'il ne peut pas créer son chemin temporaire, et tous les sites tomberaient avec lui
    # si le volume de SancturAI manquait (revue batch 6, N1). Un corps ≤ 64 Kio reste en mémoire, jamais sur disque.
    # Pire cas sur la racine partagée : vault 8 × 16 Mio = 128 Mio, /mcp et forum ≤ 256 × 256 Kio = 64 Mio
    # (connexions partagées avec le plafond de 256), soit ≈ 192 Mio au plus, libérés en 15 s si l'envoi s'arrête.
    client_body_buffer_size 64k;
    # Un envoi au compte-gouttes ne garde pas un tampon : 15 s maximum entre deux lectures du corps.
    client_body_timeout 15s;
    # 413 / 429 / 502 / 504 émis par nginx lui-même : corps au format §9.2, pas la page HTML par défaut.
    # (interception des erreurs du proxy désactivée, par défaut : les réponses d'erreur de l'app passent telles quelles.)
    error_page 413 = @sancturai_413;
    error_page 429 = @sancturai_429;
    error_page 502 504 = @sancturai_busy;
    access_log /var/log/nginx/sancturai.access.log sancturai_nouri;
    error_log /var/log/nginx/sancturai.error.log alert;

    # Corps trop gros : même statut (422) et même JSON que l'app (app/middleware.py, too_large_error).
    location @sancturai_413 {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control no-store always;
        return 422 '{"error":"VALIDATION_ERROR","message":"request body exceeds 65536 bytes for this route","hint":"Corrige les champs indiqués dans message."}';
    }

    location @sancturai_vault_413 {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control no-store always;
        return 422 '{"error":"VALIDATION_ERROR","message":"request body exceeds 16777216 bytes for this route","hint":"Corrige les champs indiqués dans message."}';
    }

    location @sancturai_forum_413 {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control no-store always;
        return 422 '{"error":"VALIDATION_ERROR","message":"request body exceeds 131072 bytes for this route","hint":"Corrige les champs indiqués dans message."}';
    }

    # même conseil que l'app (MCP_TOO_LARGE_HINT) ; \' = apostrophe dans une chaîne nginx entre apostrophes
    location @sancturai_mcp_413 {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control no-store always;
        return 422 '{"error":"VALIDATION_ERROR","message":"request body exceeds 262144 bytes for this route","hint":"Une requête MCP est limitée à 256 Kio : pour un fichier plus gros (jusqu\'à la limite du vault), utilise l\'API REST : PUT /api/vault/<chemin>."}';
    }

    location @sancturai_429 {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 1 always;
        return 429 '{"error":"RATE_LIMITED","message":"too many requests","hint":"Attends retry_after secondes avant de réessayer.","retry_after":1}';
    }

    # app absente ou en redémarrage (déploiement)
    location @sancturai_busy {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 10 always;
        return 503 '{"error":"SERVER_BUSY","message":"service unavailable","hint":"Le serveur est saturé : réessaie plus tard.","retry_after":10}';
    }

    location /internal/ {
        return 404;
    }

    # Les locations à plafond propre reprennent à l'identique le proxy (SSE), les limiteurs et les en-têtes de
    # `location /` ; un error_page local remplace tous ceux hérités : 429 et 502/504 sont redéclarés.
    # Vault : 16 Mio (fichier de 5 Mo en base64 ou texte échappé en JSON) ; l'app ramène les autres méthodes
    # que PUT à 64 Kio. ^~ : prioritaire sur l'expression régulière /mcp, comme dans l'app.
    # Seule location dont les corps vont sur disque : 2 envois par IP et 8 au total (l'app n'en traite de toute façon
    # qu'un de 16 Mio à la fois, BODY_BUDGET_BYTES = 17 Mio) ; lectures et autres locations non comptées.
    # Envoi = toute méthode autre que GET/HEAD/OPTIONS : nginx accepte 16 Mio ici quelle que soit la méthode.
    location ^~ /api/vault/ {
        client_max_body_size 16m;
        error_page 413 = @sancturai_vault_413;
        error_page 429 = @sancturai_429;
        error_page 502 504 = @sancturai_busy;
        limit_req zone=sancturai burst=40 nodelay;
        limit_req_status 429;
        limit_conn sancturai_conn 20;
        limit_conn sancturai_vault_conn 2;
        limit_conn sancturai_vault_total 8;
        limit_conn sancturai_total 256;
        limit_conn_status 429;
        proxy_pass http://sancturai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # flux MCP (SSE)
        proxy_read_timeout 300s;
    }

    location ^~ /api/forum/ {
        client_max_body_size 128k;
        error_page 413 = @sancturai_forum_413;
        error_page 429 = @sancturai_429;
        error_page 502 504 = @sancturai_busy;
        limit_req zone=sancturai burst=40 nodelay;
        limit_req_status 429;
        limit_conn sancturai_conn 20;
        limit_conn sancturai_total 256;
        limit_conn_status 429;
        proxy_pass http://sancturai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # flux MCP (SSE)
        proxy_read_timeout 300s;
    }

    # /mcp et /mcp/... (pas /mcpx, comme _is_mcp)
    location ~ ^/mcp(/|$) {
        client_max_body_size 256k;
        error_page 413 = @sancturai_mcp_413;
        error_page 429 = @sancturai_429;
        error_page 502 504 = @sancturai_busy;
        limit_req zone=sancturai burst=40 nodelay;
        limit_req_status 429;
        limit_conn sancturai_conn 20;
        limit_conn sancturai_total 256;
        limit_conn_status 429;
        proxy_pass http://sancturai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # flux MCP (SSE)
        proxy_read_timeout 300s;
    }

    location / {
        limit_req zone=sancturai burst=40 nodelay;
        limit_req_status 429;
        limit_conn sancturai_conn 20;
        limit_conn sancturai_total 256;
        limit_conn_status 429;
        proxy_pass http://sancturai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # flux MCP (SSE)
        proxy_read_timeout 300s;
    }
}

# Listener local pour l'hôte (bot → /internal/*). Jamais exposé : 127.0.0.1 uniquement, pas de X-Forwarded-For.
# Il ne sert que /internal/* et réécrit X-Real-IP : un client local ne peut pas imposer son IP.
# Port 8300 : vérifier qu'il est libre avant d'activer ce fichier (setup.md §4) ; nginx -t ne lie aucun socket.
server {
    listen 127.0.0.1:8300;
    server_name _;
    client_max_body_size 64k;
    # app en redémarrage (déploiement) : le bot reçoit le JSON §9.2, pas la page 502 HTML (revue batch 6, m5)
    error_page 502 504 = @sancturai_busy;
    access_log /var/log/nginx/sancturai.access.log sancturai_nouri;
    error_log /var/log/nginx/sancturai.error.log alert;

    location @sancturai_busy {
        include snippets/security-headers.conf;
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 10 always;
        return 503 '{"error":"SERVER_BUSY","message":"service unavailable","hint":"Le serveur est saturé : réessaie plus tard.","retry_after":10}';
    }

    location /internal/ {
        proxy_pass http://sancturai_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
    }

    location / {
        return 404;
    }
}
