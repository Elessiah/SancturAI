name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # sur main, un push rapide n'annule pas la publication de l'image du précédent (son SHA resterait sans image)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Les étapes sont conditionnées à l'existence des fichiers : la CI reste verte tant que le code
# des tâches correspondantes n'est pas encore écrit (Task 1 : pyproject, Task 17 : relay, Task 19 : Dockerfile).
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # aucun git authentifié après le checkout : le jeton ne reste pas dans .git/config
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: hashFiles('pyproject.toml') != ''
        with:
          version: "0.11.32"  # = image uv de deploy/Dockerfile et `uv --version` local
          python-version: "3.13"
          enable-cache: true
      - name: Install
        if: hashFiles('pyproject.toml') != ''
        run: uv sync --frozen
      - name: Lint
        if: hashFiles('pyproject.toml') != ''
        run: uv run ruff check .
      - name: Types
        if: hashFiles('pyproject.toml') != ''
        run: uv run mypy app
      - name: Tests
        if: hashFiles('pyproject.toml') != ''
        run: uv run pytest -q
      - name: Relay install
        if: hashFiles('relay/pyproject.toml') != ''
        working-directory: relay
        run: uv sync --frozen
      - name: Relay tests
        if: hashFiles('relay/pyproject.toml') != ''
        working-directory: relay
        run: uv run pytest -q

  # PR : l'image est construite (amd64, sans publication) pour qu'un Dockerfile cassé ne soit pas découvert après fusion
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # aucun git authentifié après le checkout : le jeton ne reste pas dans .git/config
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: hashFiles('deploy/Dockerfile') != ''
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: hashFiles('deploy/Dockerfile') != ''
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # aucun git authentifié après le checkout : le jeton ne reste pas dans .git/config
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: hashFiles('deploy/Dockerfile') != ''
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: hashFiles('deploy/Dockerfile') != ''
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: hashFiles('deploy/Dockerfile') != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: hashFiles('deploy/Dockerfile') != ''
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          # sans cache, chaque push réinstalle toutes les dépendances sous émulation QEMU (lent)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER }}/sancturai:latest
            ghcr.io/${{ env.OWNER }}/sancturai:${{ github.sha }}
