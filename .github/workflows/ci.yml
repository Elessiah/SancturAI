name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # sur main, un push rapide n'annule pas la publication de l'image du précédent (son SHA resterait sans image)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Les étapes sont conditionnées à l'existence des fichiers : la CI reste verte tant que le code
# des tâches correspondantes n'est pas encore écrit (Task 1 : pyproject, Task 17 : relay, Task 19 : Dockerfile).
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # aucun git authentifié après le checkout : le jeton ne reste pas dans .git/config
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        if: hashFiles('pyproject.toml') != ''
        with:
          version: "0.11.32"  # = image uv de deploy/Dockerfile et `uv --version` local
          python-version: "3.13"
          enable-cache: true
      - name: Install
        if: hashFiles('pyproject.toml') != ''
        run: uv sync --frozen
      - name: Lint
        if: hashFiles('pyproject.toml') != ''
        run: uv run ruff check .
      - name: Types
        if: hashFiles('pyproject.toml') != ''
        run: uv run mypy app
      - name: Tests
        if: hashFiles('pyproject.toml') != ''
        run: uv run pytest -q
      - name: Relay install
        if: hashFiles('relay/pyproject.toml') != ''
        working-directory: relay
        run: uv sync --frozen
      - name: Relay tests
        if: hashFiles('relay/pyproject.toml') != ''
        working-directory: relay
        run: uv run pytest -q

  # PR : l'image est construite (amd64, sans publication) pour qu'un Dockerfile cassé ne soit pas découvert après fusion
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # aucun git authentifié après le checkout : le jeton ne reste pas dans .git/config
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: hashFiles('deploy/Dockerfile') != ''
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: hashFiles('deploy/Dockerfile') != ''
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: sancturai:ci
      # Fumée : hors de /app (comme alembic et la CLI en prod), le code et la commande `sancturai` sont trouvés
      - if: hashFiles('deploy/Dockerfile') != ''
        run: docker run --rm --workdir / sancturai:ci sh -c 'python -c "import app.db_models, app.cli, app.main" && command -v sancturai && command -v alembic'

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # aucun git authentifié après le checkout : le jeton ne reste pas dans .git/config
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: hashFiles('deploy/Dockerfile') != ''
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: hashFiles('deploy/Dockerfile') != ''
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: hashFiles('deploy/Dockerfile') != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: hashFiles('deploy/Dockerfile') != ''
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          push: true
          # sans cache, chaque push réinstalle toutes les dépendances sous émulation QEMU (lent)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ env.OWNER }}/sancturai:latest
            ghcr.io/${{ env.OWNER }}/sancturai:${{ github.sha }}
