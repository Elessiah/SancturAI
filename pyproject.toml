[project]
name = "sancturai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pynacl>=1.5",
  "cryptography>=44",
  "mnemonic>=0.21",
  "base58>=2.1",
  "mcp>=1.30,<1.31",  # internes du SDK 1.30 : session_manager._server_instances, FastMCP._tool_manager, ToolError.__cause__ = ValidationError (arguments)
]

[project.scripts]
sancturai = "app.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "httpx>=0.28",
  "asgi-lifespan>=2.1",
  "testcontainers[postgres]>=4.9",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["relay", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
